<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gincana SAFA 2026 — Controle de Doações</title>
<meta name="description" content="Sistema de controle e ranking da Gincana SAFA 2026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="sidebarToggle" class="sidebar-toggle" aria-label="Abrir menu">☰ Menu</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-inner">
      <h2>🔗 Planilhas do Google</h2>

      <label for="urlAsaNorte">Link CSV - Asa Norte</label>
      <input type="text" id="urlAsaNorte" spellcheck="false">

      <label for="urlSobradinho">Link CSV - Sobradinho</label>
      <input type="text" id="urlSobradinho" spellcheck="false">

      <hr>

      <h2>⚙️ Status da Gincana</h2>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="status" value="parcial" checked>
          <span>🟢 Em Andamento (Resultados Parciais)</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="status" value="final">
          <span>🔴 Finalizada (Resultado Oficial Final)</span>
        </label>
      </div>

      <button id="btnAtualizar" class="btn-primary">🔄 Atualizar / Recarregar Dados</button>

      <p class="sidebar-hint">As alterações nos links são salvas neste navegador. Os dados são atualizados automaticamente a cada 5 minutos.</p>
    </div>
  </aside>

  <main class="main">
    <header class="page-header">
      <h1>🏆 Gincana SAFA 2026</h1>
      <p class="subtitle">Sistema de Controle e Ranking</p>
    </header>
    <hr>

    <div id="alerts"></div>

    <div id="content">
      <div class="empty-state">
        <p>👈 Carregando dados das planilhas...</p>
      </div>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" integrity="sha512-2/YdOMV+YNpanLCF5MdQwaoFRVbTmrJ4u4EpqS/USXAQNUDgI5uwYi6J98WVtJKcfe1AbgerygzDFToxAlOGEQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="logo.js"></script>
<script src="pdf.js"></script>
<script src="script.js"></script>
</body>
</html>
